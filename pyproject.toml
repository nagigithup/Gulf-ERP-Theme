[project]
name = "gulf_erp_theme"
description = "Independent bilingual Desk theme with Lumen 0.9.1 feature parity"
requires-python = ">=3.14"
readme = "README.md"
license = {file = "LICENSE"}
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.12,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
erpnext = ">=16.0.0,<17.0.0"

[tool.flit.sdist]
include = ["gulf_erp_theme/", "frontend/", "tools/", "docs/", "LICENSE", "THIRD_PARTY_NOTICES.md", "COPYING.md", "CHANGELOG.md", "SECURITY.md"]
